name: Portfolio visual QA

on:
  push:
    branches:
      - main
      - portfolio-v1
      - portfolio-diagram-system

permissions:
  contents: read

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Install Selenium
        run: python3 -m pip install --quiet selenium

      - name: Start static server
        run: |
          python3 -m http.server 8000 > /tmp/portfolio-http.log 2>&1 &
          sleep 2

      - name: Run browser QA and capture screenshots
        run: |
          cat > /tmp/visual_qa.py <<'PY'
          import base64
          import json
          import os
          import time
          from pathlib import Path
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options

          pages = [
              "index.html",
              "ai-engineering.html",
              "execution-system.html",
              "npi-readiness.html",
              "engineering-visibility.html",
              "connected-positioning.html",
              "wireless-module.html",
              "storage-platform.html",
              "product-engineering.html",
              "engineering-leadership.html",
              "cv.html",
          ]
          viewports = {
              "desktop": (1440, 1000),
              "tablet": (1024, 900),
              "mobile": (390, 844),
          }

          out = Path("qa-screenshots")
          out.mkdir(exist_ok=True)
          results = []
          failed = False

          options = Options()
          options.add_argument("--headless=new")
          options.add_argument("--no-sandbox")
          options.add_argument("--disable-dev-shm-usage")
          options.add_argument("--hide-scrollbars")
          options.add_argument("--force-device-scale-factor=1")

          driver = webdriver.Chrome(options=options)
          try:
              for viewport_name, (width, height) in viewports.items():
                  driver.set_window_size(width, height)

                  for page in pages:
                      url = f"http://127.0.0.1:8000/{page}"
                      driver.get(url)
                      time.sleep(0.35)

                      driver.execute_script(
                          "document.documentElement.style.scrollBehavior='auto';"
                          "document.querySelectorAll('.reveal').forEach(el => el.classList.add('is-visible'));"
                      )

                      audit = driver.execute_script(
                          """
                          const width = window.innerWidth;
                          const doc = document.documentElement;
                          const offenders = [...document.querySelectorAll('body *')]
                            .filter(el => {
                              const s = getComputedStyle(el);
                              if (s.position === 'fixed') return false;
                              const r = el.getBoundingClientRect();
                              return r.right > width + 2 || r.left < -2;
                            })
                            .slice(0, 20)
                            .map(el => {
                              const r = el.getBoundingClientRect();
                              return {
                                tag: el.tagName,
                                cls: el.className || '',
                                left: Math.round(r.left),
                                right: Math.round(r.right),
                                width: Math.round(r.width)
                              };
                            });

                          const links = [...document.querySelectorAll('a[href^="#"]')]
                            .map(a => a.getAttribute('href'))
                            .filter(h => h && h.length > 1);
                          const missingAnchors = links.filter(h => !document.querySelector(h));

                          const diagramIssues = [...document.querySelectorAll('.editorial-diagram svg')].map((svg, index) => {
                            const vb = svg.viewBox && svg.viewBox.baseVal;
                            if (!vb || !vb.width || !vb.height) {
                              return {index, issue: 'missing-viewbox'};
                            }
                            const textIssues = [...svg.querySelectorAll('text')].map((node) => {
                              try {
                                const b = node.getBBox();
                                const outside = b.x < vb.x - 1 || b.y < vb.y - 1 ||
                                  b.x + b.width > vb.x + vb.width + 1 ||
                                  b.y + b.height > vb.y + vb.height + 1;
                                return outside ? {
                                  text: node.textContent.trim(),
                                  x: Math.round(b.x),
                                  y: Math.round(b.y),
                                  width: Math.round(b.width),
                                  height: Math.round(b.height)
                                } : null;
                              } catch (e) {
                                return {text: node.textContent.trim(), issue: 'bbox-error'};
                              }
                            }).filter(Boolean);
                            const rendered = svg.getBoundingClientRect();
                            return {
                              index,
                              viewBox: [vb.x, vb.y, vb.width, vb.height],
                              renderedWidth: Math.round(rendered.width),
                              renderedHeight: Math.round(rendered.height),
                              textIssues
                            };
                          });

                          return {
                            viewportWidth: width,
                            scrollWidth: doc.scrollWidth,
                            scrollHeight: doc.scrollHeight,
                            horizontalOverflow: doc.scrollWidth > width + 2,
                            offenders,
                            missingAnchors,
                            diagramIssues
                          };
                          """
                      )

                      if audit["horizontalOverflow"] or audit["missingAnchors"]:
                          failed = True
                      if any(d.get("textIssues") for d in audit.get("diagramIssues", [])):
                          failed = True

                      driver.execute_script("window.scrollTo(0, 0)")
                      time.sleep(0.1)
                      top_path = out / f"{page.replace('.html','')}-{viewport_name}-top.png"
                      driver.save_screenshot(str(top_path))

                      # Capture a viewport at the selected-work / main-content area.
                      target = "#work" if page == "index.html" else "main section:nth-of-type(2)"
                      driver.execute_script(
                          """
                          const el = document.querySelector(arguments[0]);
                          if (el) el.scrollIntoView({block:'start', behavior:'auto'});
                          """,
                          target,
                      )
                      time.sleep(0.15)
                      mid_path = out / f"{page.replace('.html','')}-{viewport_name}-content.png"
                      driver.save_screenshot(str(mid_path))

                      diagram_paths = []
                      for diagram_index, diagram in enumerate(driver.find_elements("css selector", ".editorial-diagram")):
                          diagram_path = out / f"{page.replace('.html','')}-{viewport_name}-diagram-{diagram_index+1}.png"
                          diagram.screenshot(str(diagram_path))
                          diagram_paths.append(str(diagram_path))

                      results.append({
                          "page": page,
                          "viewport": viewport_name,
                          "diagramScreenshots": diagram_paths,
                          **audit,
                      })

              Path("qa-results.json").write_text(json.dumps(results, indent=2))
              print(json.dumps(results, indent=2))
          finally:
              driver.quit()

          if failed:
              raise SystemExit("Browser QA found horizontal overflow or missing anchors.")
          PY
          python3 /tmp/visual_qa.py

      - name: Upload screenshots and QA results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-visual-qa
          path: |
            qa-screenshots/
            qa-results.json
          if-no-files-found: error
